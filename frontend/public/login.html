<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in - Rento</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
<div class="brand">Rento</div>
<div class="nav-links">
    <a href="index.html">Home</a>
    <a href="browse.html">Browse Vehicles</a>
    <a href="index.html#footer">Services</a>
    <a href="index.html#footer">About us</a>
    <a href="index.html#footer">Contact</a>
</div>
<div class="nav-auth">
    <a href="login.html">Log in</a>
    <a href="register.html">Sign up</a>
</div>
</div>

<div class="auth-wrap">
    <div class="auth-card">
    <h2 class="auth-title">Welcome back</h2>
    <div class="auth-divider-line"></div>

    <form id="login-form">
        <div class="form-group">
        <label for="role">Login as</label>
        <select id="role">
            <option value="customer">Customer</option>
            <option value="staff">Staff / Admin</option>
        </select>
        </div>

        <div class="form-group">
        <label for="email">Email address</label>
        <input type="email" id="email" placeholder="name@gmail.com">
        <div class="error-text" id="email-error">Enter a valid email.</div>
        </div>

        <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••">
        <div class="error-text" id="password-error">Enter your password.</div>
        </div>

        <div class="auth-row">
        <label class="auth-checkbox">
            <input type="checkbox" id="remember">
            Remember me
        </label>
        <a href="#" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-block">Log in</button>
    </form>

    <p class="auth-footer">Don't have an account? <a href="register.html">Sign up</a></p>
    </div>
</div>

<script src="data.js"></script>
<script src="login.js"></script>
</body>
</html>
